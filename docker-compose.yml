services:

  backend:
    image: ${DOCKER_USERNAME:-layangdigital}/sentradapur-backend:latest
    pull_policy: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin_user:Layang2020@shared-postgres:5432/sentra_dapur_db}
      APP_URL: ${APP_URL:-https://api.sentradapur.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://sentradapur.com}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    volumes:
      - uploads-data:/app/uploads
    networks:
      - nginx-network
    expose:
      - "3001"

  frontend:
    image: ${DOCKER_USERNAME:-layangdigital}/sentradapur-frontend:latest
    pull_policy: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.sentradapur.com}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api.sentradapur.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.sentradapur.com}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api.sentradapur.com}
    depends_on:
      - backend
    networks:
      - nginx-network
    expose:
      - "3000"

volumes:
  uploads-data:

networks:
  nginx-network:
    external: true

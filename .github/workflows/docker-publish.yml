name: Publish Docker Images

on:
  push:
    branches: [ "main" ]
  # Memungkinkan workflow dijalankan secara manual dari tab Actions
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BUILD & PUSH BACKEND
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sentradapur-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sentradapur-backend:${{ github.sha }}

      # BUILD & PUSH FRONTEND
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sentradapur-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sentradapur-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.sentradapur.com
            NEXT_PUBLIC_BACKEND_URL=https://api.sentradapur.com
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Trigger Portainer Webhook
        run: |
          echo "Memanggil Webhook Portainer untuk memperbarui stack..."
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"